# Настройки для хостинга Render (render.com)
# Ключи ИИ вводятся в Render (Environment), в код они не попадают
services:
  - type: web
    name: resume-builder-kg
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # бесплатный ИИ (console.groq.com) — достаточно одного из двух ключей
      - key: GROQ_API_KEY
        sync: false
      # Claude, платный (platform.claude.com/settings/keys)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ALLOWED_ORIGIN
        value: https://alizhajloobekov-cmd.github.io
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
